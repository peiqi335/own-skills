<div id="previewModal" class="modal" role="dialog" aria-modal="true" aria-label="报告预览"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle"></h3><a id="modalNewTabLink" class="btn" target="_blank" rel="noopener">新标签页查看报告</a><a id="modalLiveLink" class="btn" target="_blank" rel="noopener">NCBI 在线参数</a><button id="closeModal" class="modal-close" aria-label="关闭">×</button></div><p id="modalProvenanceWarning" class="muted" role="status">$boundary</p><div class="modal-body"><iframe id="modalIframe" class="modal-iframe" src="about:blank" title="证据派生展示页"></iframe></div></div></div><script>
const modal=document.getElementById('previewModal'); let activeCell=null;
function openCell(cell){if(!cell?.dataset.report)return;activeCell=cell;document.getElementById('modalProvenanceWarning').textContent=cell.dataset.provenance;document.getElementById('modalTitle').textContent=cell.dataset.title;document.getElementById('modalIframe').src=cell.dataset.report;document.getElementById('modalNewTabLink').href=cell.dataset.report;const live=document.getElementById('modalLiveLink');live.href=cell.dataset.live;live.style.display=cell.dataset.live?'inline-block':'none';modal.classList.add('open');document.getElementById('closeModal').focus();}
function closeModal(){modal.classList.remove('open');document.getElementById('modalIframe').src='about:blank';activeCell?.focus();}
document.addEventListener('click',e=>{const c=e.target.closest('td[data-report]');if(c)openCell(c);});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('td[data-report]')){e.preventDefault();openCell(e.target);}});document.getElementById('closeModal').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal();};
</script></body></html>
